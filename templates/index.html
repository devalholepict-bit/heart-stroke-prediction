<!DOCTYPE html>
<html>
<head>
    <title>Heart Stroke Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Heart Stroke Prediction</h1>

    <label>Age</label>
    <input type="number" id="age" value="40">

    <label>Sex</label>
    <select id="sex">
        <option value="M">Male</option>
        <option value="F">Female</option>
    </select>

    <label>Chest Pain Type</label>
    <select id="chest_pain">
        <option value="ATA">ATA</option>
        <option value="NAP">NAP</option>
        <option value="TA">TA</option>
        <option value="ASY">ASY</option>
    </select>

    <label>Resting BP</label>
    <input type="number" id="resting_bp" value="120">

    <label>Cholesterol</label>
    <input type="number" id="cholesterol" value="200">

    <label>Fasting Blood Sugar</label>
    <select id="fasting_bs">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>Resting ECG</label>
    <select id="resting_ecg">
        <option value="Normal">Normal</option>
        <option value="ST">ST</option>
        <option value="LVH">LVH</option>
    </select>

    <label>Max Heart Rate</label>
    <input type="number" id="max_hr" value="150">

    <label>Exercise Angina</label>
    <select id="exercise_angina">
        <option value="Y">Yes</option>
        <option value="N">No</option>
    </select>

    <label>Oldpeak</label>
    <input type="number" step="0.1" id="oldpeak" value="1.0">

    <label>ST Slope</label>
    <select id="st_slope">
        <option value="Up">Up</option>
        <option value="Flat">Flat</option>
        <option value="Down">Down</option>
    </select>

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>
</div>

<script src="/static/script.js"></script>
</body>
</html>
